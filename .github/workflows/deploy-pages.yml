name: Deploy 161324 GitHub Pages site

on:
  push:
    branches:
      - main
    paths:
      - 'notes/**/*.Rmd'
      - 'notes/_bookdown.yml'
      - 'notes/_output.yml'
      - 'notes/style.css'
      - 'notes/install_packages.R'
      - 'notes/helpers/**'
      - 'notes/graphics/**'
      - 'notes/data/**'
      - 'notes/preamble.tex'
      - 'lectures/lecture10.qmd'
      - 'lectures/lecture11.qmd'
      - 'lectures/lecture12.qmd'
      - 'lectures/lecture11.scss'
      - 'lectures/custom_quarto.css'
      - 'lectures/widgets/**'
      - 'data/**'
      - 'common/*.R'
      - 'labs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglpk40 libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - name: Install R packages
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages("remotes")
          source("notes/install_packages.R")
          pkgs <- c(
            "tidyverse", "tidymodels", "baguette", "ranger", "xgboost",
            "stacks", "arules", "arulesViz", "cluster", "dbscan", "uwot",
            "arrow", "jsonlite", "vip", "Matrix", "irlba",
            "patchwork", "skimr", "rsample"
          )
          install.packages(pkgs)

      - name: Render notes
        shell: Rscript {0}
        run: |
          setwd("notes")
          bookdown::render_book("index.Rmd", output_format = "bookdown::gitbook")

      - name: Render reveal lectures
        run: |
          quarto render lectures/lecture10.qmd
          quarto render lectures/lecture11.qmd
          quarto render lectures/lecture12.qmd

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/notes _site/lectures _site/data _site/labs

          cp -r notes/_book/. _site/notes/
          cp lectures/lecture10.html _site/lectures/lecture10.html
          cp lectures/lecture11.html _site/lectures/lecture11.html
          cp lectures/lecture12.html _site/lectures/lecture12.html
          cp -r lectures/lecture10_files _site/lectures/
          cp -r lectures/lecture11_files _site/lectures/
          cp -r lectures/lecture12_files _site/lectures/
          cp -r lectures/widgets _site/lectures/widgets
          cp -r labs/. _site/labs/

          shopt -s nullglob
          csv_files=(data/*.csv)
          gz_files=(data/*.csv.gz)

          if [ ${#csv_files[@]} -gt 0 ]; then
            for f in "${csv_files[@]}"; do
              gzip -c "$f" > "_site/data/$(basename "$f").gz"
            done
          fi

          if [ ${#gz_files[@]} -gt 0 ]; then
            cp data/*.csv.gz _site/data/
          fi

          cat > _site/lectures/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>161.324 Data Mining - Lectures | Dr Nicholas Knowlton</title>
            <meta name="description" content="Lecture materials for 161.324 Data Mining at Massey University, taught by Dr Nicholas Knowlton.">
            <meta name="author" content="Dr Nicholas Knowlton">
            <link rel="canonical" href="https://knowlton.co.nz/161324/lectures/">
            <link rel="author" href="https://knowlton.co.nz/">
            <style>
              body { font-family: system-ui, sans-serif; max-width: 680px; margin: 3rem auto; padding: 0 1.5rem; color: #222; }
              h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
              p.subtitle { color: #555; margin-top: 0; }
              ul { list-style: none; padding: 0; }
              li { margin: 0.75rem 0; }
              a { color: #197278; font-size: 1.1rem; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .sub { color: #666; font-size: 0.9rem; margin-left: 0.5rem; }
            </style>
          </head>
          <body>
            <h1>161.324 Data Mining</h1>
            <p class="subtitle">Lecture slides</p>
            <ul>
              <li><a href="lecture10.html">Lecture 10</a><span class="sub">Cluster Analysis</span></li>
              <li><a href="lecture11.html">Lecture 11</a><span class="sub">Association Rule Mining</span></li>
              <li><a href="lecture12.html">Lecture 12</a><span class="sub">Ensemble Learning</span></li>
            </ul>
          </body>
          </html>
          EOF

          cat > _site/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>161.324 Data Mining | Dr Nicholas Knowlton</title>
              <meta name="description" content="Notes, lectures, labs and data for 161.324 Data Mining at Massey University, taught by Dr Nicholas Knowlton.">
              <meta name="author" content="Dr Nicholas Knowlton">
              <link rel="canonical" href="https://knowlton.co.nz/161324/">
              <link rel="author" href="https://knowlton.co.nz/">
              <style>
                :root { color: #20313b; background: #f5f1e8; font-family: Georgia, serif; }
                * { box-sizing: border-box; }
                body { max-width: 72rem; margin: 0 auto; padding: 4rem 1.5rem; }
                header { max-width: 54rem; margin-bottom: 3rem; }
                h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 0.98; margin: 0; color: #12334a; }
                .lead { font-size: 1.15rem; line-height: 1.6; margin: 1.25rem 0 0; }
                .byline { margin: 0.7rem 0 0; font-size: 0.95rem; color: #56636b; }
                .byline a, .course-description a { color: #1d5b63; text-decoration-thickness: 1px; text-underline-offset: 0.15em; }
                .course-grid { display: grid; grid-template-columns: minmax(15rem, 0.9fr) minmax(0, 1.35fr); gap: clamp(2rem, 6vw, 4.5rem); align-items: start; }
                h2 { margin: 0 0 1rem; font-size: 1.05rem; letter-spacing: 0.04em; text-transform: uppercase; color: #46545c; }
                nav { display: grid; gap: 0.8rem; }
                nav a { display: block; background: #1d5b63; color: #fff; padding: 1rem 1.25rem; text-decoration: none; font-size: 1.15rem; font-weight: 600; }
                nav a:hover, nav a:focus-visible { background: #133f45; }
                .course-description { border-left: 1px solid #c9c3b8; padding-left: clamp(1.5rem, 4vw, 2.5rem); }
                .course-description p { margin: 0; font-size: 1.08rem; line-height: 1.7; }
                @media (max-width: 720px) {
                  body { padding-top: 2.5rem; }
                  header { margin-bottom: 2.2rem; }
                  .course-grid { grid-template-columns: 1fr; gap: 2.2rem; }
                  .course-description { border-left: 0; border-top: 1px solid #c9c3b8; padding: 1.75rem 0 0; }
                }
              </style>
            </head>
            <body>
              <header>
                <h1>161.324<br>Data Mining</h1>
                <p class="lead">Course notes, lecture slides, labs and datasets.</p>
                <p class="byline">Course materials by <a href="https://knowlton.co.nz/" rel="author">Dr Nicholas Knowlton</a>, Massey University.</p>
              </header>
              <main class="course-grid">
                <section>
                  <h2>Course materials</h2>
                  <nav aria-label="Course materials">
                    <a href="./notes/">Notes</a>
                    <a href="./lectures/">Lectures</a>
                    <a href="./labs/">Labs</a>
                    <a href="./data/">Data</a>
                  </nav>
                </section>
                <section class="course-description">
                  <h2>About this course</h2>
                  <p>An introduction to data mining methods for discovering useful structure and patterns in data. The course covers practical approaches to classification, clustering, association rules and ensemble learning, with an emphasis on applying statistical and machine-learning methods to real datasets.</p>
                </section>
              </main>
            </body>
          </html>
          EOF

      - name: Generate sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote

          root = Path("_site")
          urls = []
          for page in sorted(root.rglob("*.html")):
              rel = page.relative_to(root).as_posix()
              if any(token in rel.lower() for token in ("_guide", "-sols", "/solutions/", "/answers/")):
                  continue
              if rel.endswith("index.html"):
                  rel = rel[:-10]
              urls.append("https://knowlton.co.nz/161324/" + quote(rel, safe="/"))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              *[f"  <url><loc>{url}</loc></url>" for url in urls],
              "</urlset>",
              "",
          ]
          (root / "sitemap.xml").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
